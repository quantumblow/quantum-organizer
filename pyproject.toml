[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quantum-organizer"
version = "0.1.0"
description = "Organize messy photo/video folders by Chinese province/city, with rename, undo and a WebUI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "quantum-locator>=0.1,<1",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff", "mypy"]

[project.scripts]
qorg = "quantum_organizer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_organizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
