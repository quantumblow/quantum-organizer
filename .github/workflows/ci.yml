name: CI
on:
  push: { branches: [main, feat/**] }
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout quantum-locator
        uses: actions/checkout@v4
        with:
          repository: quantumblow/quantum-locator
          ref: main
          path: locator
          # 上游是私有仓库，默认 GITHUB_TOKEN 读不到它
          token: ${{ secrets.LOCATOR_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - name: Install ffmpeg + exiftool
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl
      - name: Install quantum-locator from the sibling checkout
        run: pip install ./locator
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout quantum-locator
        uses: actions/checkout@v4
        with:
          repository: quantumblow/quantum-locator
          ref: main
          path: locator
          # 上游是私有仓库，默认 GITHUB_TOKEN 读不到它
          token: ${{ secrets.LOCATOR_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the locator wheel for the image
        run: pip wheel ./locator --no-deps -w docker/wheels
      - name: Build the image
        run: docker build -t quantum-organizer:ci .
      - name: Smoke test the image
        run: |
          docker run --rm --entrypoint qorg quantum-organizer:ci doctor
          docker run --rm --entrypoint python quantum-organizer:ci \
            -c "import quantum_locator, shapely; print('locator ok', shapely.__version__)"
